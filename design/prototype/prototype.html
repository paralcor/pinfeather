<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>片羽 界面原型</title>
<style>
/* 主题变量按 shadcn/ui 的命名，实现时直接对应 globals.css */
:root {
  --background: #ffffff; --foreground: #09090b; --card: #ffffff; --popover: #ffffff;
  --muted: #f4f4f5; --muted-foreground: #6b6b74; --accent: #f4f4f5; --accent-foreground: #18181b;
  --border: #e4e4e7; --input: #d9d9de; --ring: #e0587d;
  --primary: #b8325a; --primary-foreground: #ffffff;
  --selected: #fdecf1; --selected-border: #f3b6c7;
  --destructive: #c42727; --warning: #a15c00; --warning-bg: #fff6e5; --success: #18794e;
  --brand: #f26a8d; --brand-deep: #b8325a;
  --code-bg: #f8f8f9; --kw: #a3215a; --str: #1f6f43; --cm: #7a7a85; --num: #8a4b00;
  --desk: #dfe3ea; --taskbar: rgba(243 244 247 / .92); --shadow: 0 10px 30px rgb(0 0 0 / .12), 0 2px 6px rgb(0 0 0 / .06);
  --radius: 8px; --radius-sm: 6px;
  --fs: 13px; --row: 34px; --pad: 8px; --gap: 8px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --background: #0c0c0e; --foreground: #f4f4f5; --card: #111114; --popover: #16161a;
  --muted: #1f1f23; --muted-foreground: #a1a1aa; --accent: #232328; --accent-foreground: #f4f4f5;
  --border: #2a2a30; --input: #34343b; --ring: #f47a99;
  --primary: #f47a99; --primary-foreground: #2a0a14;
  --selected: #3a1622; --selected-border: #7a2c45;
  --destructive: #f26b6b; --warning: #f0b45b; --warning-bg: #2d2210; --success: #4cc38a;
  --code-bg: #141418; --kw: #f59ab5; --str: #8fd6a9; --cm: #85858f; --num: #f0b45b;
  --desk: #1b1e24; --taskbar: rgba(28 28 32 / .92); --shadow: 0 10px 30px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
  color-scheme: dark;
}
:root[data-accent="neutral"] { --primary: #18181b; --primary-foreground: #fafafa; --selected: #f0f0f2; --selected-border: #d4d4d8; --ring: #71717a; }
:root[data-theme="dark"][data-accent="neutral"] { --primary: #f4f4f5; --primary-foreground: #18181b; --selected: #26262b; --selected-border: #3f3f46; --ring: #a1a1aa; }
:root[data-density="comfortable"] { --fs: 14px; --row: 40px; --pad: 10px; --gap: 10px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--foreground); font: var(--fs)/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: "Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; } svg.i.lg { width: 20px; height: 20px; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }

/* ---------- 原型控制栏（不属于产品） ---------- */
.proto { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px; background: #fffbe8; color: #3d3a2a; border-bottom: 1px dashed #c9bd7a; font-size: 12px; }
:root[data-theme="dark"] .proto { background: #24210f; color: #e6dfb8; border-color: #6b6230; }
.proto .tag { font-weight: 600; padding: 1px 8px; border-radius: 99px; background: rgb(0 0 0 / .08); }
.proto label { display: inline-flex; align-items: center; gap: 6px; }
.proto .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 7px; background: rgb(0 0 0 / .07); }
:root[data-theme="dark"] .proto .seg, :root[data-theme="dark"] .proto .tag { background: rgb(255 255 255 / .08); }
.proto .seg button { border: 0; background: transparent; padding: 2px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.proto .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
:root[data-theme="dark"] .proto .seg button[aria-pressed="true"] { background: #3a3519; }
.proto .pbtn { border: 1px solid rgb(0 0 0 / .18); background: transparent; border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
:root[data-theme="dark"] .proto .pbtn { border-color: rgb(255 255 255 / .2); }

/* ---------- 通用组件（对应 shadcn Nova） ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--row) - 4px); padding: 0 calc(var(--pad) + 2px); border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; font-weight: 500; transition: background .15s, border-color .15s, color .15s; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-outline { border-color: var(--input); background: var(--background); }
.btn-outline:hover:not(:disabled), .btn-ghost:hover:not(:disabled) { background: var(--accent); }
.btn-ghost { color: var(--foreground); }
.btn-danger { color: var(--destructive); }
.btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--destructive) 10%, transparent); }
.btn-icon { width: calc(var(--row) - 4px); padding: 0; }
.btn-sm { height: calc(var(--row) - 8px); padding: 0 8px; font-size: 12px; }
.btn-icon.btn-sm { width: calc(var(--row) - 8px); padding: 0; }
.btn[aria-pressed="true"] { background: var(--selected); color: var(--foreground); border-color: var(--selected-border); }
.input { height: calc(var(--row) - 4px); width: 100%; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--input); background: var(--background); outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.input[aria-invalid="true"] { border-color: var(--destructive); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.55; }
select.input { padding-right: 6px; }
.field { display: grid; gap: 4px; }
.field > label, .label { font-size: 12px; font-weight: 500; color: var(--foreground); }
.hint { font-size: 12px; color: var(--muted-foreground); }
.err { font-size: 12px; color: var(--destructive); }
.search { position: relative; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); pointer-events: none; }
.search .input { padding-left: 30px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.badge.brand { border-color: var(--selected-border); background: var(--selected); color: var(--foreground); }
.badge.warn { border-color: transparent; background: var(--warning-bg); color: var(--warning); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { color: var(--foreground); }
.chip[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
.switch { position: relative; width: 34px; height: 20px; flex: none; border-radius: 99px; border: 0; background: var(--input); cursor: pointer; transition: background .15s; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
:root[data-theme="dark"] .switch[aria-checked="true"]::after { background: var(--primary-foreground); }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.kbd { display: inline-flex; align-items: center; height: 18px; min-width: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); border-bottom-width: 2px; font-size: 11px; color: var(--muted-foreground); background: var(--background); font-family: inherit; }
.sep { height: 1px; background: var(--border); margin: 6px 0; }
.app-tile { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.empty { display: grid; justify-items: center; gap: 8px; padding: 40px 16px; text-align: center; color: var(--muted-foreground); }
.empty svg.i { width: 28px; height: 28px; stroke-width: 1.5; }
.empty b { color: var(--foreground); font-weight: 600; }
.menu { position: absolute; z-index: 30; min-width: 180px; padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--popover); box-shadow: var(--shadow); animation: pop .14s ease-out; }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; height: calc(var(--row) - 4px); padding: 0 8px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--accent); outline: none; }
.menu .mh { padding: 4px 8px; font-size: 11px; color: var(--muted-foreground); }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
@keyframes rowin { from { opacity: 0; transform: translateY(-6px); background: var(--selected); } }

/* ---------- 场景 ---------- */
#stage { position: relative; height: calc(100vh - var(--proto-h, 42px)); min-height: 560px; overflow: auto; }
.desk { position: relative; height: 100%; min-width: 900px; background: var(--desk); overflow: hidden; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; padding: 0 12px; background: var(--taskbar); border-top: 1px solid var(--border); backdrop-filter: blur(12px); }
.taskbar .mid { flex: 1; display: flex; justify-content: center; gap: 4px; }
.taskbar .tb { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; border: 0; background: transparent; }
.taskbar .tb.on { background: rgb(128 128 128 / .14); }
.taskbar .ph { width: 22px; height: 22px; border-radius: 5px; background: rgb(128 128 128 / .3); }
.tray { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.tray .ti { width: 30px; height: 30px; border-radius: 5px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; }
.tray .ti:hover, .tray .ti[aria-expanded="true"] { background: rgb(128 128 128 / .18); }
.tray .ti img { width: 16px; height: 16px; }
.tray .ti.paused img { opacity: .45; }
.tray .clock { padding: 0 8px; text-align: right; line-height: 1.25; }
.editor { position: absolute; left: 6%; top: 7%; width: min(640px, 56%); height: min(440px, 64%); display: flex; flex-direction: column; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
.editor .tt { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.editor textarea { flex: 1; border: 0; outline: none; resize: none; padding: 14px 16px; background: transparent; line-height: 1.7; }
.editor .hintbar { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 快捷面板 */
.qp { position: absolute; right: 24px; bottom: 60px; width: 420px; height: 540px; display: flex; flex-direction: column; border-radius: 12px; background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; transform-origin: 85% 100%; animation: qpin .17s cubic-bezier(.2,.9,.3,1); }
.qp.split { width: 760px; }
.qp.closing { animation: qpout .12s ease-in forwards; }
@keyframes qpin { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes qpout { to { opacity: 0; transform: translateY(6px) scale(.985); } }
.qp .qhead { padding: 10px 10px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--border); }
.qp .qhead .search .input { height: 36px; font-size: 14px; border-color: transparent; background: var(--muted); }
.qp .qhead .search .input:focus { background: var(--background); }
.qp .qbody { flex: 1; min-height: 0; display: flex; }
.qp .qlist { flex: 1; min-width: 0; overflow: auto; padding: 4px; }
.qp.split .qlist { flex: 0 0 340px; border-right: 1px solid var(--border); }
.qp .qprev { flex: 1; min-width: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.qp .drawer { border-top: 1px solid var(--border); max-height: 210px; overflow: auto; padding: 10px 12px; background: var(--card); animation: pop .15s ease-out; }
.qp .qfoot { display: flex; align-items: center; gap: 4px 9px; padding: 7px 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted-foreground); flex-wrap: wrap; }
.qp .qfoot span { display: inline-flex; align-items: center; gap: 4px; }
.qp .paused-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--warning-bg); color: var(--warning); font-size: 12px; }
.qp .paused-bar .btn { margin-left: auto; color: inherit; }
.grp { padding: 8px 8px 4px; font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: .02em; }
.row { position: relative; display: flex; align-items: center; gap: 10px; min-height: var(--row); padding: 5px 8px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--accent); }
.row[aria-selected="true"] { background: var(--selected); border-color: var(--selected-border); }
.row .ico { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--muted); color: var(--muted-foreground); overflow: hidden; }
.row .ico img { width: 100%; height: 100%; object-fit: cover; }
.row .txt { flex: 1; min-width: 0; }
.row .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { font-size: 11.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.row .num { font-size: 11px; color: var(--muted-foreground); width: 14px; text-align: center; }
.row .star { color: #d99a00; }
.row.enter { animation: rowin .35s ease-out; }
.row .chk { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--input); display: grid; place-items: center; flex: none; background: var(--background); }
.row .chk svg { width: 12px; height: 12px; stroke-width: 3; }
.row[data-multi="true"] .chk { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

/* 管理窗口 */
.winwrap { height: 100%; min-width: 980px; display: grid; place-items: center; padding: 16px; background: var(--desk); }
.win { width: min(1240px, 100%); height: min(780px, 100%); display: flex; flex-direction: column; border-radius: 10px; background: var(--background); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; position: relative; }
.titlebar { height: 38px; display: flex; align-items: center; gap: 8px; padding-left: 12px; border-bottom: 1px solid var(--border); background: var(--card); font-size: 12px; flex: none; }
.titlebar img { width: 16px; height: 16px; }
.titlebar .wc { margin-left: auto; display: flex; height: 100%; }
.titlebar .wc span { width: 46px; display: grid; place-items: center; color: var(--muted-foreground); }
.wbody { flex: 1; min-height: 0; display: flex; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane.fill { flex: 1; min-width: 300px; }
.side { flex-shrink: 0; }
.resizer { flex: 0 0 1px; position: relative; background: var(--border); cursor: col-resize; outline: none; }
.resizer::after { content: ""; position: absolute; inset: 0 -4px; }
.resizer:hover, .resizer:focus-visible, .resizer.drag { background: var(--ring); }
.side { background: var(--card); padding: 8px; gap: 2px; overflow: hidden; }
.side .nav { display: flex; align-items: center; gap: 10px; height: var(--row); padding: 0 10px; border-radius: var(--radius-sm); border: 0; background: transparent; cursor: pointer; color: var(--muted-foreground); width: 100%; text-align: left; white-space: nowrap; }
.side .nav:hover { background: var(--accent); color: var(--foreground); }
.side .nav[aria-current="page"] { background: var(--selected); color: var(--foreground); font-weight: 600; }
.side .nav .cnt { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--muted-foreground); }
.side .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px; font-weight: 600; white-space: nowrap; }
.side .brand img { width: 22px; height: 22px; }
.side .grow { flex: 1; }
.side .status { display: grid; gap: 8px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--background); font-size: 12px; }
.side .status .l { display: flex; align-items: center; gap: 8px; }
.side .status .l .switch { margin-left: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
.dot.off { background: var(--warning); } .dot.idle { background: var(--muted-foreground); }
.side.collapsed .lbl, .side.collapsed .cnt, .side.collapsed .status, .side.collapsed .brand span { display: none; }
.side.collapsed .nav { justify-content: center; padding: 0; }
.side.collapsed .brand { justify-content: center; padding: 6px 0 12px; }
.phead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); min-height: 52px; flex-wrap: wrap; }
.phead h1, .phead h2 { margin: 0; font-size: 14px; font-weight: 600; }
.phead .sp { flex: 1; }
.scroll { flex: 1; min-height: 0; overflow: auto; }
.toolbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.bulk { display: flex; gap: 6px; align-items: center; padding: 6px 12px; background: var(--selected); border-bottom: 1px solid var(--selected-border); animation: pop .14s ease-out; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 8px 12px; }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; cursor: pointer; background: var(--card); min-width: 0; align-content: start; }
.card:hover { border-color: var(--input); }
.card[aria-selected="true"] { border-color: var(--selected-border); background: var(--selected); }
.card .body { font-size: 12px; color: var(--muted-foreground); max-height: 72px; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
.card img { width: 100%; height: 86px; object-fit: cover; border-radius: 4px; }
.prev { padding: 14px 16px; display: grid; gap: 14px; align-content: start; }
.prev .content { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.prev pre, .qprev pre, .drawer pre { margin: 0; padding: 12px; background: var(--code-bg); overflow: auto; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.prev .text, .qprev .text, .drawer .text { padding: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.65; }
.prev img, .qprev img, .drawer img { display: block; max-width: 100%; }
.linkcard { display: flex; gap: 10px; padding: 12px; align-items: flex-start; }
.linkcard .fav { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); display: grid; place-items: center; flex: none; }
.linkcard a { color: var(--primary); word-break: break-all; }
:root[data-accent="neutral"] .linkcard a { text-decoration: underline; }
.meta { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; font-size: 12px; }
.meta dt { color: var(--muted-foreground); } .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
mark { background: color-mix(in srgb, var(--brand) 32%, transparent); color: inherit; border-radius: 2px; }
.tok-kw { color: var(--kw); } .tok-str { color: var(--str); } .tok-cm { color: var(--cm); font-style: italic; } .tok-num { color: var(--num); }

/* 集合 */
.colitem { display: flex; align-items: center; gap: 8px; width: 100%; height: var(--row); padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; text-align: left; }
.colitem:hover { background: var(--accent); }
.colitem[aria-current="true"] { background: var(--selected); font-weight: 600; }
.colitem .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sortlist { display: grid; gap: 8px; padding: 12px; }
.mat { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; padding: 8px 8px 8px 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s; }
.mat.dragging { z-index: 5; box-shadow: var(--shadow); transition: box-shadow .18s; border-color: var(--selected-border); }
.mat.lifting { transition: none; }
.mat .handle { width: 22px; border: 0; background: transparent; border-radius: 5px; color: var(--muted-foreground); cursor: grab; display: grid; place-items: center; touch-action: none; }
.mat .handle:hover { background: var(--accent); color: var(--foreground); }
.mat.dragging .handle { cursor: grabbing; }
.mat .head { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted-foreground); margin-bottom: 4px; }
.mat .head b { color: var(--foreground); font-weight: 600; }
.mat textarea { width: 100%; min-height: 54px; }
.mat .snippet { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 92px; overflow: hidden; }
.mat .snippet.code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; background: var(--code-bg); padding: 6px 8px; border-radius: 5px; }
.mat .ops { display: flex; flex-direction: column; gap: 2px; }
.compose { padding: 12px; display: grid; gap: 12px; align-content: start; border-bottom: 1px solid var(--border); }
.compose .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.md { margin: 0; padding: 14px; font-family: inherit; font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.md .pill, .tpl-view .pill { display: inline; padding: 1px 6px; border-radius: 5px; background: var(--selected); border: 1px solid var(--selected-border); font-family: inherit; }
.md .pill.miss, .tpl-view .pill.miss { background: color-mix(in srgb, var(--destructive) 10%, transparent); border-color: color-mix(in srgb, var(--destructive) 40%, transparent); color: var(--destructive); }
.md .mat-block { color: var(--muted-foreground); }
.ai-note { display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); background: var(--card); }
.ai-note b { color: var(--foreground); }
.tpl-view { padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius); line-height: 1.9; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }

/* 设置 */
.settings { max-width: 760px; padding: 8px 20px 40px; }
.settings section { padding: 18px 0; border-bottom: 1px solid var(--border); display: grid; gap: 12px; }
.settings h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.settings .srow { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
.settings .srow > div:first-child { min-width: 0; }
.settings .srow .d { font-size: 12px; color: var(--muted-foreground); }
.settings .list { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.settings .list > div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.settings .list > div:last-child { border-bottom: 0; }
.settings .codeblk { margin: 0; padding: 10px 12px; border-radius: var(--radius); background: var(--code-bg); border: 1px solid var(--border); font-size: 12px; line-height: 1.7; }
.settings .disabled { opacity: .55; }
.rec { min-width: 170px; justify-content: center; font-family: inherit; }
.rec.on { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }

/* toast（对应 sonner） */
.toasts { position: absolute; right: 16px; bottom: 16px; z-index: 40; display: grid; gap: 8px; width: 340px; pointer-events: none; }
.desk .toasts { bottom: 64px; right: auto; left: 50%; transform: translateX(-50%); }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--popover); box-shadow: var(--shadow); font-size: 12.5px; animation: toastin .2s cubic-bezier(.2,.9,.3,1); }
.toast.warn { border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.toast.warn > svg { color: var(--warning); }
.toast.ok > svg { color: var(--success); }
.toast .tb { flex: 1; min-width: 0; } .toast .tb b { display: block; font-weight: 600; }
.toast .btn { margin-left: auto; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

/* 对话框 */
.overlay { position: absolute; inset: 0; z-index: 35; background: rgb(0 0 0 / .32); display: grid; place-items: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(560px, 92%); max-height: 80%; display: flex; flex-direction: column; border-radius: 12px; background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow); animation: pop .16s ease-out; }
.dialog header { padding: 14px 16px 8px; } .dialog header h2 { margin: 0 0 2px; font-size: 15px; }
.dialog footer { padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
.dialog .dbody { padding: 0 16px 10px; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.dialog { overflow: hidden; }
</style>

/* ---------- store（接口照 Zustand：getState / setState / subscribe） ---------- */
function createStore(init) {
  let state = init; const subs = new Set();
  return {
    getState: () => state,
    setState: (p) => { state = { ...state, ...(typeof p === "function" ? p(state) : p) }; subs.forEach((f) => f(state)); },
    subscribe: (f) => (subs.add(f), () => subs.delete(f))
  };
}

const clock = (m) => { const d = new Date(NOW - m * 60000); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const dayOf = (m) => (m < 15 * 60 + 40 ? "今天" : m < 15 * 60 + 40 + 1440 ? "昨天" : "更早");

function matches(c, query, type, fav) {
  if (type === "fav" && !c.fav) return false;
  if (type !== "all" && type !== "fav" && c.type !== type) return false;
  if (fav && !c.fav) return false;
  if (!query) return true;
  const hay = (c.text + " " + (c.title || "") + " " + (APPS[c.app]?.name || "")).toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}
function hl(text, query) {
  const t = esc(text);
  if (!query) return t;
  const ws = query.split(/\s+/).filter(Boolean).map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return ws.length ? t.replace(new RegExp(`(${ws.join("|")})`, "gi"), "<mark>$1</mark>") : t;
}
// 极简代码着色：注释、字符串、关键字、数字
const KW = /\b(fn|let|mut|match|return|loop|async|await|const|export|function|SELECT|FROM|WHERE|ORDER|BY|LIMIT|DESC|if|else|Ok|Err|Result|String|pub|struct|impl|use|map|new|Set)\b/g;
function codeHtml(src) {
  return src.split(/(\/\/[^\n]*|#[^\n[]*$|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/m).map((p, i) => {
    if (i % 2) return `<span class="${p.startsWith("//") || p.startsWith("#") ? "tok-cm" : "tok-str"}">${esc(p)}</span>`;
    return esc(p).replace(KW, '<span class="tok-kw">$1</span>').replace(/\b(\d+)\b/g, '<span class="tok-num">$1</span>');
  }).join("");
}
function contentHtml(c, q = "") {

  if (c.type === "code" || c.type === "log") return `<pre class="mono">${q ? hl(c.text, q) : codeHtml(c.text)}</pre>`;
  if (c.type === "link") return `<div class="linkcard"><span class="fav">${ic("link")}</span><div style="min-width:0"><div style="font-weight:600;margin-bottom:2px">${esc(c.title || "")}</div><a href="${esc(c.text)}" target="_blank" rel="noopener">${hl(c.text, q)}</a></div></div>`;

}

/* ---------- 集合 ---------- */
function parseTpl(body) {
  // 返回 [{t:"text",v}|{t:"slot",name}]；\{{ 表示字面花括号
  const out = []; const re = /\\\{\{|\{\{\s*([^{}]*?)\s*\}\}/g; let i = 0, m;
  while ((m = re.exec(body))) {
    if (m.index > i) out.push({ t: "text", v: body.slice(i, m.index) });
    out.push(m[0] === "\\{{" ? { t: "text", v: "{{" } : { t: "slot", name: m[1] });
    i = re.lastIndex;
  }
  if (i < body.length) out.push({ t: "text", v: body.slice(i) });
  return out;
}
const slotNames = (body) => [...new Set(parseTpl(body).filter((x) => x.t === "slot" && x.name !== "材料").map((x) => x.name))];
function materialsMd(items) {
  return items.map((m, i) => {
    const head = `### 片段 ${i + 1}（${APPS[m.app].name}）`;
    if (m.type === "code" || m.type === "log") return `${head}\n\`\`\`${m.lang || ""}\n${m.text}\n\`\`\``;
    if (m.type === "image") return `${head}\n[图片：${m.text}]`;
    return `${head}\n${m.text}`;
  }).join("\n\n");
}
// 生成合并文本；html=true 时给参数加胶囊，缺参数标红
function compose(col, tpl, html) {
  const mats = materialsMd(col.items);
  const e = html ? esc : (x) => x;
  if (!tpl) return html ? `<span class="mat-block">${esc(mats)}</span>` : mats;
  let usedMat = false;
  const body = parseTpl(tpl.body).map((x) => {
    if (x.t === "text") return e(x.v);
    if (x.name === "材料") { usedMat = true; return html ? `<span class="mat-block">${esc(mats)}</span>` : mats; }
    const v = (col.params || {})[x.name];
    if (!html) return v || `{{${x.name}}}`;
    return v ? `<span class="pill">${esc(v)}</span>` : `<span class="pill miss">缺少：${esc(x.name)}</span>`;
  }).join("");
  return usedMat ? body : body + (html ? `\n\n<span class="mat-block">${esc(mats)}</span>` : "\n\n" + mats);
}

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", (e) => {
  const s = S(), k = e.key;
  // 录制快捷键
  if (s.recHotkey) {
    e.preventDefault();
    if (k === "Escape") return set({ recHotkey: false });
    if (["Control", "Shift", "Alt", "Meta"].includes(k)) return;
    const combo = [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Win"].filter(Boolean);
    if (!combo.length) return toast("warn", "至少要带一个修饰键", "例如 Ctrl、Alt 或 Shift。");
    return set({ hotkey: [...combo, k.length === 1 ? k.toUpperCase() : k], recHotkey: false });
  }
  if (s.dialog && k === "Escape") return closeDialog();
  if (s.dialog && k === "Tab") { // 焦点留在对话框里
    const f = [...document.querySelectorAll("#dlg button:not(:disabled), #dlg input")]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if ((s.menu || s.trayMenu) && k === "Escape") return set({ menu: null, trayMenu: false });
  // 唤出快捷面板（原型里用页面内快捷键模拟全局热键）
  const hk = s.hotkey, want = (m) => hk.includes(m);
  if (s.scene === "quick" && e.ctrlKey === want("Ctrl") && e.shiftKey === want("Shift") && e.altKey === want("Alt") && k.toUpperCase() === hk[hk.length - 1]) { e.preventDefault(); return s.qOpen ? closeQuick() : openQuick(); }
  if (s.scene === "quick" && s.pendingPaste && e.target.id === "ed" && e.ctrlKey && k.toLowerCase() === "v") { e.preventDefault(); caret = e.target.selectionStart; return insertText(s.pendingPaste); }
  if (s.scene === "quick" && s.qOpen) {
    const items = qItems();
    if (k === "Escape") { e.preventDefault(); return closeQuick(() => document.getElementById("ed")?.focus()); }
    if (k === "ArrowDown" || k === "ArrowUp") { e.preventDefault(); const n = Math.max(0, Math.min(items.length - 1, s.qSel + (k === "ArrowDown" ? 1 : -1))); set({ qSel: n }); document.getElementById("qo-" + items[n]?.id)?.scrollIntoView({ block: "nearest" }); return; }
    if (k === "Enter") { e.preventDefault(); return pasteSelected(e.shiftKey); }
    if (k === "Tab" && s.qLayout === "single") { e.preventDefault(); return set({ qPreview: !s.qPreview }); }
    if (e.ctrlKey && /^[1-9]$/.test(k)) { e.preventDefault(); if (items[+k - 1]) { set({ qSel: +k - 1 }); pasteSelected(false); } return; }
    if (e.ctrlKey && k.toLowerCase() === "d") { e.preventDefault(); const c = items[s.qSel]; if (c) { set({ clips: s.clips.map((x) => (x.id === c.id ? { ...x, fav: !x.fav } : x)) }); toast("ok", c.fav ? "已取消收藏" : "已收藏", "", null, 1800); } return; }
    if (e.ctrlKey && e.shiftKey && k.toLowerCase() === "s") { e.preventDefault(); const c = items[s.qSel]; if (c) addTo(s.activeCol, [c.id]); return; }
  }
  // 历史列表 ↑↓
  if (s.scene === "manager" && s.page === "history" && (k === "ArrowDown" || k === "ArrowUp") && (e.target.id === "hlist" || e.target.id === "hq")) {
    e.preventDefault(); const ids = hItems().map((c) => c.id), i = ids.indexOf(s.hSel ?? ids[0]);
    const n = ids[Math.max(0, Math.min(ids.length - 1, i + (k === "ArrowDown" ? 1 : -1)))]; set({ hSel: n, hMulti: [] });
    stage.querySelector(`[data-id="${n}"]`)?.scrollIntoView({ block: "nearest" }); return;
  }
  if (s.scene === "manager" && s.page === "history" && k === "Delete" && e.target.id === "hlist") { const ids = s.hMulti.length ? s.hMulti : s.hSel ? [s.hSel] : []; if (ids.length) delClips(ids); return; }
  // 片段排序：焦点在拖动手柄上时 Alt+↑/↓
  if (e.target.dataset && e.target.dataset.handle && e.altKey && (k === "ArrowUp" || k === "ArrowDown")) { e.preventDefault(); moveMat(e.target.dataset.handle, k === "ArrowUp" ? -1 : 1, true); return; }
  // 分隔条：←→ 调宽度
  if (e.target.dataset && e.target.dataset.split && (k === "ArrowLeft" || k === "ArrowRight")) { e.preventDefault(); const key = e.target.dataset.split; setSize(key, s.sizes[key] + (k === "ArrowLeft" ? -16 : 16)); }
});
function moveMat(mid, d, refocus) {
  const s = S(); updCol(s.activeCol, (c) => { const it = [...c.items], i = it.findIndex((m) => m.id === mid), j = i + d; if (j < 0 || j >= it.length) return c; [it[i], it[j]] = [it[j], it[i]]; return { ...c, items: it }; });
  if (refocus) setTimeout(() => document.querySelector(`[data-handle="${mid}"]`)?.focus());
}

/* ---------- 分隔条（模拟 react-resizable-panels） ---------- */
const LIM = { side: [56, 260], hlist: [280, 640], clist: [160, 320], cmid: [320, 640], tlist: [160, 320], tmid: [320, 640] };
function setSize(key, v) { const [a, b] = LIM[key]; v = Math.max(a, Math.min(b, Math.round(v))); if (key === "side" && v < 120) v = 56; set((s) => ({ sizes: { ...s.sizes, [key]: v } })); }
document.addEventListener("pointerdown", (e) => {
  const r = e.target.closest(".resizer");
  if (r) {
    e.preventDefault(); const key = r.dataset.split, start = e.clientX, w0 = S().sizes[key], pane = r.previousElementSibling;
    r.classList.add("drag"); r.setPointerCapture(e.pointerId);
    const mv = (ev) => { const [a, b] = LIM[key]; pane.style.width = Math.max(a, Math.min(b, w0 + ev.clientX - start)) + "px"; };
    const up = (ev) => { r.removeEventListener("pointermove", mv); r.removeEventListener("pointerup", up); setSize(key, w0 + ev.clientX - start); };
    r.addEventListener("pointermove", mv); r.addEventListener("pointerup", up);
    return;
  }
  const h = e.target.closest("[data-handle]");
  if (h) startSort(e, h);
});

/* ---------- 拖拽排序（模拟 dnd-kit 的 SortableContext） ---------- */
function startSort(e, handle) {
  e.preventDefault();
  const list = document.getElementById("sortlist"), cards = [...list.querySelectorAll(".mat")], me = handle.closest(".mat");
  const from = cards.indexOf(me), rects = cards.map((c) => c.getBoundingClientRect()), gap = cards.length > 1 ? rects[1].top - rects[0].bottom : 8;
  const h = rects[from].height + gap, y0 = e.clientY; let to = from;
  me.classList.add("dragging", "lifting"); handle.setPointerCapture(e.pointerId);
  const mv = (ev) => {
    const dy = ev.clientY - y0; me.style.transform = `translateY(${dy}px) scale(1.01)`;
    const mid = rects[from].top + rects[from].height / 2 + dy;
    to = from; rects.forEach((r, i) => { if (i < from && mid < r.top + r.height / 2) to = Math.min(to, i); if (i > from && mid > r.top + r.height / 2) to = Math.max(to, i); });
    cards.forEach((c, i) => { if (c === me) return; c.style.transform = i >= to && i < from ? `translateY(${h}px)` : i <= to && i > from ? `translateY(${-h}px)` : ""; });
  };
  const up = () => {
    handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up);
    // 落位：先滑到目标位置，再提交新顺序
    me.classList.remove("lifting");
    const target = to > from ? rects[to].bottom - rects[from].bottom : rects[to].top - rects[from].top;
    me.style.transform = `translateY(${target}px)`;
    setTimeout(() => {
      const mid = me.dataset.mid;
      updCol(S().activeCol, (c) => { const it = [...c.items], [m] = it.splice(from, 1); it.splice(to, 0, m); return { ...c, items: it }; });
      if (to !== from) toast("ok", `片段已移到第 ${to + 1} 位`, "", null, 1600);
      document.querySelector(`[data-handle="${mid}"]`)?.focus({ preventScroll: true });
    }, 180);
  };
  handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
}

render();
if (S().qOpen) setTimeout(() => document.getElementById("qq")?.focus());
</script>
