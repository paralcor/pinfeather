name: 问题报告 / Bug report
description: 片羽收录不到内容、回贴失败或出现其他异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。信息越完整，越容易定位问题；缺少必填信息的 issue 可能无法处理。
        English reports are welcome.

        **issue 是公开的。** 贴出复制内容、截图或日志前，请先检查有没有密码、令牌、聊天记录等不想公开的东西。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 片羽已更新到最新版（从源码构建的，已更新到最新的 `main`）
          required: true
        - label: 已搜索[已有 issue](https://github.com/paralcor/pinfeather/issues?q=is%3Aissue)，包括已关闭的，没有重复
          required: true
        - label: 这个 issue 只报告一个问题
          required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: AI 使用说明 / AI disclosure
      description: 写这个 issue 时有没有借助 AI。用了也没关系，如实说明即可，见 [CONTRIBUTING.md](https://github.com/paralcor/pinfeather/blob/main/CONTRIBUTING.md#使用-ai-的说明)。
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字，问题是我自己遇到的
        - 问题由 AI 发现或分析（例如 AI 代码审查），我已自己确认过
        - 问题由 AI 发现或分析，我还没有自己确认
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: 用了 AI 就必须填，写具体型号和版本，不要只写“AI”。
      placeholder: chatgpt-6.1-sol

  - type: input
    id: version
    attributes:
      label: 片羽版本
      description: 在片羽“设置 → 关于”中查看；从源码构建的，写提交号。
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本与架构
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 收录剪贴内容
        - 快捷面板
        - 回贴
        - 历史与搜索
        - 集合与模板
        - AI 接入（CLI / MCP）
        - 设置
        - 安装或启动
        - 其他
    validations:
      required: true

  - type: input
    id: apps
    attributes:
      label: 相关应用
      description: 从哪个应用复制、粘贴到哪个应用。很多问题只在特定应用里出现。
      placeholder: 从 Chrome 复制，粘贴到 VS Code

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步写出怎样能触发这个问题。
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 发生了什么。界面上有报错的话，请照原文贴出来。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或其他补充
