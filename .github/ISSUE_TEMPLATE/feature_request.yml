name: 功能建议 / Feature request
description: 建议新功能，或对规划、界面原型提意见
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        English requests are welcome.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索[已有 issue](https://github.com/paralcor/pinfeather/issues?q=is%3Aissue)，包括已关闭的，没有重复
          required: true
        - label: 已看过 README 的[计划](https://github.com/paralcor/pinfeather#计划)和[交接文档](https://github.com/paralcor/pinfeather/blob/main/rumo_clipboard_handoff/docs/pinfeather_project_handoff.md)的版本路线
          required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: AI 使用说明 / AI disclosure
      description: 写这个 issue 时有没有借助 AI。用了也没关系，如实说明即可，见 [CONTRIBUTING.md](https://github.com/paralcor/pinfeather/blob/main/CONTRIBUTING.md#使用-ai-的说明)。
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字
        - 建议内容主要由 AI 生成或分析
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: 用了 AI 就必须填，写具体型号和版本，不要只写“AI”。
      placeholder: chatgpt-6.1-sol

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景，以及现在哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 希望片羽怎样处理。涉及界面的，可以对照[界面原型](https://github.com/paralcor/pinfeather/blob/main/design/prototype/README.md)说明。

  - type: textarea
    id: workaround
    attributes:
      label: 现在的替代办法
      description: 目前是怎么绕过这个问题的，或者其他剪贴板工具是怎么做的。
